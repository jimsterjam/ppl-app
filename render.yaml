# Render manifest for ppl-app
# - Static Site: client (build -> client/dist)
# - Web Service: server (Node.js)

staticSites:
  - type: static
    name: ppl-app-client
    repo: https://github.com/jimsterjam/ppl-app.git
    branch: main
    # Tests laufen zusätzlich in GitHub Actions (.github/workflows/ci.yml, sichtbar pro
    # Push/PR), aber weiterhin auch hier als Sicherheitsnetz direkt vor dem Deploy - ein
    # tatsächlicher Test-Fehlschlag soll den Deploy nicht durchlassen.
    buildCommand: cd client && npm ci && npm test && npm run build
    publishPath: client/dist

services:
  - type: web
    name: ppl-app-server
    runtime: node
    repo: https://github.com/jimsterjam/ppl-app.git
    branch: main
    # Siehe Kommentar oben bei staticSites - Tests laufen zusätzlich in GitHub Actions,
    # bleiben aber auch hier als Deploy-Sicherheitsnetz.
    buildCommand: cd server && npm ci && npm test
    startCommand: cd server && npm run start
    plan: free
    envVars:
      - key: MONGO_URI
        sync: false
        value: ""
      # Clerk-Variablen entfernt
      - key: OPENAI_API_KEY
        sync: false
        value: ""
      - key: NODE_ENV
        sync: false
        value: production
      - key: FIREBASE_ADMIN_CREDENTIAL_JSON
        sync: false
        value: ""
