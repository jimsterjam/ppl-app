# Render manifest for ppl-app
# - Static Site: client (build -> client/dist)
# - Web Service: server (Node.js)

staticSites:
  - type: static
    name: ppl-app-client
    repo: https://github.com/jimsterjam/ppl-app.git
    branch: main
    # Tests laufen jetzt separat in GitHub Actions (.github/workflows/ci.yml), nicht mehr
    # als Teil des Render-Build-Commands. Grund: ein Test-Fehlschlag (oder auch nur eine
    # einmalige Flakiness auf Renders Build-Maschine) hat bisher den kompletten Deploy
    # blockiert - inkl. Fällen, in denen ein manueller Redeploy Sekunden später ohne jede
    # Codeänderung durchlief. Render soll nur noch bauen/deployen, nicht mehr testen.
    buildCommand: cd client && npm ci && npm run build
    publishPath: client/dist

services:
  - type: web
    name: ppl-app-server
    runtime: node
    repo: https://github.com/jimsterjam/ppl-app.git
    branch: main
    # Siehe Kommentar oben bei staticSites - Tests laufen jetzt in GitHub Actions statt hier.
    buildCommand: cd server && npm ci
    startCommand: cd server && npm run start
    plan: free
    envVars:
      - key: MONGO_URI
        sync: false
        value: ""
      # Clerk-Variablen entfernt
      - key: OPENAI_API_KEY
        sync: false
        value: ""
      - key: NODE_ENV
        sync: false
        value: production
      - key: FIREBASE_ADMIN_CREDENTIAL_JSON
        sync: false
        value: ""
