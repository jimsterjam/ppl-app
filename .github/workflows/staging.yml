name: Staging Build & Smoke

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

jobs:
  # ── Job 1: Tests (blockiert den Build-Job bei Fehler) ──────────────────────
  test:
    name: Unit tests (client + server)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: 'npm'

      - name: Server — install & test
        working-directory: server
        run: |
          npm ci
          npm test

      - name: Client — install & test
        working-directory: client
        run: |
          npm ci
          npm test

  # ── Job 2: Build (läuft nur wenn Tests grün sind) ──────────────────────────
  build:
    name: Build client & server (staging)
    runs-on: ubuntu-latest
    needs: test   # ← blockiert bei Test-Fehler; kein fehlerhafter Build wird deployed
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: 'npm'

      - name: Build client
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Upload client build artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 1

      - name: Upload server artifact (source)
        uses: actions/upload-artifact@v4
        with:
          name: server-source
          path: server
          retention-days: 1

      - name: Staging smoke tests placeholder
        run: |
          echo "Staging build complete. Add steps to deploy and run E2E tests against staging URL."

