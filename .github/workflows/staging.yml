name: Staging Build & Smoke

on:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

jobs:
  build_and_test:
    name: Build client & server (staging)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: 'npm'

      - name: Install & build server
        working-directory: server
        run: |
          npm ci
          # run server tests if present (do not fail workflow on test absence)
          if [ -f package.json ] && npm run | grep -q "test"; then npm test || true; fi
          # optional build step
          if npm run | grep -q "build"; then npm run build || true; fi

      - name: Install & build client
        working-directory: client
        run: |
          npm ci
          # lint if configured (don't fail pipeline for lint in staging)
          if npm run | grep -q "lint"; then npm run lint || true; fi
          npm run build

      - name: Upload client build artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist

      - name: Upload server artifact (source)
        uses: actions/upload-artifact@v4
        with:
          name: server-source
          path: server

      - name: Staging smoke tests placeholder
        run: |
          echo "Staging build complete. Add steps to deploy and run E2E tests against staging URL."

