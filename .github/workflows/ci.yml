name: CI

# Tests liefen bisher als Teil des Render-Build-Commands (render.yaml) und konnten dadurch
# den Deploy blockieren - auch bei nur einmaliger Flakiness auf Renders Build-Maschine, obwohl
# ein manueller Redeploy Sekunden später ohne Codeänderung durchlief. Jetzt separat hier:
# sichtbares Ergebnis pro Push/PR, aber kein Einfluss mehr auf den eigentlichen Deploy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint

  client-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - working-directory: client
        run: npm ci
      - working-directory: client
        run: npm test

  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - working-directory: server
        run: npm ci
      - working-directory: server
        run: npm test

  # Website (site/): Die Tests laden die Texte der App (vue-i18n aus client/) und vergleichen die Rechenformel mit der
  # des Servers. Dafür genügen die Pakete von client/; die Dateien aus server/ brauchen keine Pakete.
  site-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - working-directory: client
        run: npm ci --ignore-scripts
      - run: npm run site:test
