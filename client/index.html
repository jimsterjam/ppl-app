<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>FBE – Form Beats Ego</title>
    <link rel="preload" href="/fonts/Comfortaa-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <style>
/* Startanimation (läuft ohne JS-Bundle, ab dem ersten Frame). Endbild = altes natives Startbild
   (Splash.imageset, 2732x2732, aspect-fill): schwarz, "fbe" weiß, Slogan grau. Maße in Einheiten
   dieser 2732-Fläche: --u = 1/2732 der längeren Bildschirmseite. */
@font-face { font-family: 'Comfortaa'; src: url('/fonts/Comfortaa-Variable.woff2') format('woff2'); font-weight: 300 700; font-display: block; }
#start-splash { --u: calc(100vmax / 2732); position: fixed; inset: 0; z-index: 2147483647; overflow: hidden; background: #000; color: #fff; font-family: 'Comfortaa', sans-serif; transition: opacity 300ms ease; }
#start-splash.is-leaving { opacity: 0; pointer-events: none; }
#start-splash .ss-mark, #start-splash .ss-slogan { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; opacity: 0; }
#start-splash .ss-mark { top: calc(var(--u) * 949); font-size: calc(var(--u) * 626); line-height: 1; font-weight: 700; color: #fff; }
#start-splash .ss-slogan { top: calc(var(--u) * 1648); font-size: calc(var(--u) * 77); line-height: 1; font-weight: 500; letter-spacing: 0.34em; padding-left: 0.34em; color: #9a9a9a; text-transform: uppercase; }
/* Sichtbar bleiben beide auch ohne JS/Animation (Fallback = statisches Startbild). */
#start-splash.is-static .ss-mark, #start-splash.is-static .ss-slogan { opacity: 1; }
#start-splash.go .ss-mark { animation: ss-mark 1.1s cubic-bezier(0.2, 0.7, 0.2, 1) both; -webkit-text-stroke: 0 #fff; }
#start-splash.go .ss-slogan { animation: ss-slogan 0.5s ease-out 0.95s both; }
@keyframes ss-mark {
  0% { transform: scale(2.6); filter: blur(10px); opacity: 0; -webkit-text-stroke-width: 0.07em; }
  35% { opacity: 1; filter: blur(3px); }
  100% { transform: scale(1); filter: blur(0); opacity: 1; -webkit-text-stroke-width: 0; }
}
@keyframes ss-slogan { from { opacity: 0; transform: translateY(calc(var(--u) * 24)); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { #start-splash .ss-mark, #start-splash .ss-slogan { opacity: 1; animation: none !important; } }
    </style>
  </head>
  <body>
    <div id="start-splash" aria-hidden="true"><div class="ss-mark">fbe</div><div class="ss-slogan">Form Beats Ego</div></div>
    <script>
(function () {
  var el = document.getElementById('start-splash');
  if (!el) return;
  window.__splashStart = Date.now();
  function go() { el.classList.add('go'); }
  // Erst starten, wenn die Schrift da ist (sonst blitzt kurz eine Ersatzschrift auf); nach 600 ms trotzdem.
  var t = setTimeout(go, 600);
  try { document.fonts.load("700 100px Comfortaa").then(function () { clearTimeout(t); go(); }, go); } catch (e) { clearTimeout(t); go(); }
})();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
